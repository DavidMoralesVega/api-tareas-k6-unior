# La misma API de tareas, ahora instrumentada con OpenTelemetry, + Grafana para verla por dentro.
# Un solo comando, igual en Windows, macOS y Linux:
#   docker compose -f docker-compose.observabilidad.yml up -d --build
# API: http://localhost:3050/api (los mismos scripts de k6) · Grafana: http://localhost:3000 (sin login)
# grafana/otel-lgtm trae en un contenedor Grafana, Prometheus (métricas), Tempo (trazas), Loki (logs)
# y el colector de OpenTelemetry. Es para aprender y probar, no para producción.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo
    ports:
      - "5433:5432"
    volumes:
      - pgdata-k6:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3050:3050"
    environment:
      PORT: 3050
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/todo?schema=public
      JWT_SECRET: clave-solo-para-clase
      NOTIFICATION_SERVICE_URL: http://localhost:3060
      # --- OpenTelemetry: todo por variables de entorno ---
      OTEL_SERVICE_NAME: api-tareas
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      # Solo lo que interesa ver: HTTP, Express, Nest y las consultas a Postgres
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,express,nestjs-core,pg
      # Sin detectores de nube (evita el aviso MetadataLookupWarning al arrancar)
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process
    working_dir: /app/packages/backend
    # Igual que docker-compose.k6.yml, pero la instrumentación se carga ANTES que la app (--require)
    command: >-
      sh -c "npx prisma migrate deploy --config prisma7.config.ts
      && npx -y tsx prisma/seed.ts
      && node --require @opentelemetry/auto-instrumentations-node/register dist/src/main.js"
    depends_on:
      postgres:
        condition: service_healthy

  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus (k6 escribe aquí con remote write)
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/k6-dashboards/k6-prometheus.json
    volumes:
      - ./grafana/provisioning/k6-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/k6-dashboards.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/k6-dashboards:ro
      - ./grafana/provisioning/grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  pgdata-k6:
